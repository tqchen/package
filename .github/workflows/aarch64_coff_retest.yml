name: Validate retained AArch64 COFF SDK
on:
  push:
    branches: [aarch64-coff-retest-858]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tqchen/tvm-ffi
          ref: c6494e7097a87c70a4b42a978f3317a9ffc821b2
          path: consumer
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - uses: actions/download-artifact@v4
        with:
          name: aarch64-coff-native-evidence
          run-id: 40327860192
          github-token: ${{ github.token }}
          path: artifact
      - name: Install dependencies and restore SDK
        shell: pwsh
        run: |
          python -m pip install uv cmake ninja scikit-build-core pytest pytest-xdist "apache-tvm-ffi==0.1.15.post1" "mlc-llvm-static==23.1.1.post0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation/restore_sdk.py
      - name: Build and install the consumer wheel
        shell: pwsh
        run: |
          uv build --wheel --no-build-isolation --out-dir wheelhouse consumer/addons/tvm_ffi_orcjit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem wheelhouse/*.whl)[0].FullName
          uv pip install --system --python python --no-deps "$wheel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Execute generated functions and lifecycle tests
        shell: pwsh
        run: |
          python -m pytest consumer/addons/tvm_ffi_orcjit/tests -v --junitxml=native-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python consumer/addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-coff-consumer-evidence
          path: |
            retained-evidence.json
            native-tests.xml
            wheelhouse/*.whl
          if-no-files-found: warn
