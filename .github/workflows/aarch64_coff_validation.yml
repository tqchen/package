name: Validate AArch64 COFF JITLink
on:
  push:
    branches: [aarch64-coff-validation-858]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tqchen/tvm-ffi
          ref: 3dc823a1017313123635806f69f02a5223334edf
          path: consumer
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Install native build dependencies
        shell: pwsh
        run: |
          python -m pip install uv cmake ninja scikit-build-core pytest pytest-xdist "apache-tvm-ffi==0.1.15.post1" "mlc-llvm-static==23.1.1.post0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl --version
      - name: Build patched LLVM JITLink and check relocations
        shell: pwsh
        run: python validation/native_coff.py
      - name: Build consumer with patched SDK
        shell: pwsh
        run: |
          uv pip install --python python --no-build-isolation --no-deps ./consumer/addons/tvm_ffi_orcjit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Execute generated functions and lifecycle tests
        shell: pwsh
        run: |
          python -m pytest consumer/addons/tvm_ffi_orcjit/tests -v --junitxml=native-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python consumer/addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aarch64-coff-native-evidence
          path: |
            native-evidence.json
            native-tests.xml
            patched-sdk.zip
          if-no-files-found: warn
